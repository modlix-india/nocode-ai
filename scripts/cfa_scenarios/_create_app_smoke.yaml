    Just call create_app(app_code="taskmate", default_page="home").
    Then list_apps(app_code="taskmate") to confirm.
    Then get_app(app_code="taskmate") to show me the UI override doc landed.
    Three tool calls total. Stop after that. No theme, no pages, no Kirun.
