name: _create_app_smoke
description: Single-turn create_app smoke after the alphabet+name fix.

client_code: SYSTEM
app_code: taskmate

setup_actions:
  - type: delete_app
    app_code: taskmate
  - type: mysql_purge_archived
    app_code: taskmate
  - type: evict_app_cache
    app_code: taskmate
    client_code: SYSTEM

turns:
